<!-- @dsCard group="Spacing" viewport="700x180" name="间距在版面中" subtitle="卡片内边距 24 · 组件间距 24 · 段落间距 32 · 章节间距 48" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;gap:1px}
.sw .n{font-size:10px;font-family:var(--font-sans);line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;opacity:.75}
.lbl{font-family:var(--font-western);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="wrap"><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);position:relative">
 <div style="position:absolute;left:0;top:0;width:var(--space-5);height:100%;background:repeating-linear-gradient(45deg,var(--brand-50),var(--brand-50) 4px,transparent 4px,transparent 8px)"></div>
 <span class="u-eyebrow">card padding = --space-5 (24px)</span>
 <div style="font-family:var(--font-sans);font-size:var(--fs-h5);font-weight:500;color:var(--text-heading)">卡片标题</div>
 <div style="font-size:var(--fs-body-s);color:var(--text-muted)">标题与正文之间 --space-3（12px）；卡片与卡片之间 --space-5（24px）。</div>
 <div class="row" style="gap:var(--space-2);margin-top:var(--space-2)">
  <span style="height:32px;padding:0 16px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--brand-600);color:#fff;font-size:13px">主操作</span>
  <span style="height:32px;padding:0 16px;display:inline-flex;align-items:center;border-radius:var(--radius-md);border:1px solid var(--border-default);font-size:13px;color:var(--text-heading)">次操作</span>
 </div>
</div></div></body></html>
