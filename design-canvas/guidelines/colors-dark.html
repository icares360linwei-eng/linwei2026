<!-- @dsCard group="Colors" viewport="700x170" name="暗色模式表面" subtitle="data-color-scheme=\"dark\"：焦墨为底，主操作翻转为宣纸白" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden}
.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px 10px;gap:2px}
.sw .n{font-size:10px;line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;opacity:.72}
.lbl{font-family:var(--font-western);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="wrap"><div data-color-scheme="dark" style="background:var(--surface-page);border-radius:var(--radius-lg);padding:18px;display:flex;gap:12px;align-items:stretch">
 <div style="flex:1;background:var(--surface-card);border-radius:var(--radius-lg);padding:14px">
  <div style="font-size:13px;color:var(--text-heading);font-weight:500">surface-card</div>
  <div style="font-size:11px;color:var(--text-muted);margin-top:5px">正文在卡面上的表现</div>
 </div>
 <div style="flex:1;background:var(--surface-raised);border-radius:var(--radius-lg);padding:14px">
  <div style="font-size:13px;color:var(--text-heading);font-weight:500">surface-raised</div>
  <div style="font-size:11px;color:var(--text-muted);margin-top:5px">悬浮层 / 抽屉</div>
 </div>
 <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px">
  <span style="height:36px;padding:0 18px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--btn-primary-bg);color:var(--btn-primary-fg);font-size:13px;font-weight:500">主操作</span>
 </div>
</div></div></body></html>
