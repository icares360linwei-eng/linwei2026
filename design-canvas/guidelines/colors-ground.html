<!-- @dsCard group="Colors" viewport="700x170" name="墨与宣 · 主结构" subtitle="全站主色是玄墨与宣纸；主操作用墨，不用品牌色——墨是最贵的颜色" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden}
.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px 10px;gap:2px}
.sw .n{font-size:10px;line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;opacity:.72}
.lbl{font-family:var(--font-western);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="wrap"><div class="sw"><div style="background:var(--ink-50);color:var(--ink-800)"><span class="n">宣 · 页面底</span><span class="h">#FBF9F5</span></div><div style="background:var(--ink-200);color:var(--ink-800)"><span class="n">薄雾 · 细线</span><span class="h">#E9E4DA</span></div><div style="background:var(--ink-700);color:#FBF9F5"><span class="n">墨灰 · 正文</span><span class="h">#45403A</span></div><div style="background:var(--ink-900);color:#FBF9F5"><span class="n">玄墨 · 标题 / 主操作</span><span class="h">#17140F</span></div></div><div class="row" style="margin-top:14px;gap:10px">
<span style="height:36px;padding:0 20px;display:inline-flex;align-items:center;border-radius:var(--radius-md);background:var(--ink-900);color:var(--ink-50);font-size:14px;font-weight:500">保存并提交</span>
<span style="height:36px;padding:0 20px;display:inline-flex;align-items:center;border-radius:var(--radius-md);border:1px solid var(--border-default);color:var(--text-heading);font-size:14px">取消</span>
<span style="height:36px;padding:0 20px;display:inline-flex;align-items:center;border-radius:var(--radius-full);background:var(--gold-400);color:var(--ink-900);font-size:14px;font-weight:500">预约参观园区</span>
<span class="tok">主操作 = ink-900 · 溢价 CTA = gold-400</span>
</div></div></body></html>
