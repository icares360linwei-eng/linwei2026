<!-- @dsCard group="Motion" viewport="700x150" name="时长与缓动" subtitle="微交互 150ms · 页面过渡 300ms · 叙事 500ms · 循环 2.4s" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;gap:1px}
.sw .n{font-size:10px;font-family:var(--font-sans);line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;opacity:.75}
.lbl{font-family:var(--font-western);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="wrap"><div class="row" style="gap:22px">

<div style="flex:1">
 <div class="lbl">150ms</div>
 <div style="height:4px;border-radius:2px;background:var(--brand-200);margin:8px 0;position:relative"><span style="position:absolute;left:0;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--brand-600)"></span></div>
 <div class="tok">--ease-out</div>
 <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Button hover / 图标切换</div>
</div>
<div style="flex:1">
 <div class="lbl">300ms</div>
 <div style="height:4px;border-radius:2px;background:var(--brand-200);margin:8px 0;position:relative"><span style="position:absolute;left:0;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--brand-600)"></span></div>
 <div class="tok">--ease-emphasized</div>
 <div style="font-size:11px;color:var(--text-muted);margin-top:4px">路由 / 弹窗出入</div>
</div>
<div style="flex:1">
 <div class="lbl">500ms</div>
 <div style="height:4px;border-radius:2px;background:var(--brand-200);margin:8px 0;position:relative"><span style="position:absolute;left:0;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--brand-600)"></span></div>
 <div class="tok">--ease-brush</div>
 <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Hero 入场</div>
</div>
<div style="flex:1">
 <div class="lbl">2400ms</div>
 <div style="height:4px;border-radius:2px;background:var(--brand-200);margin:8px 0;position:relative"><span style="position:absolute;left:0;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--brand-600)"></span></div>
 <div class="tok">--ease-linear</div>
 <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Loading 循环</div>
</div>
</div></div></body></html>
