<!-- @dsCard group="Colors" viewport="700x160" name="语义色与浅底" subtitle="成功 松绿 · 警告 铜金 · 错误 印章朱 · 信息 藏青；颜色绝不作唯一信息载体" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden}
.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px 10px;gap:2px}
.sw .n{font-size:10px;line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;opacity:.72}
.lbl{font-family:var(--font-western);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="wrap"><div class="row" style="gap:10px;align-items:stretch">

<div style="flex:1;border-radius:var(--radius-lg);overflow:hidden">
 <div style="height:38px;background:var(--state-success)"></div>
 <div style="background:var(--state-success-surface);padding:11px">
  <div style="font-size:12px;font-weight:500;color:var(--state-success)">成功 · 正向反馈</div>
  <div class="tok" style="margin-top:4px">--state-success</div>
 </div>
</div>
<div style="flex:1;border-radius:var(--radius-lg);overflow:hidden">
 <div style="height:38px;background:var(--state-warning)"></div>
 <div style="background:var(--state-warning-surface);padding:11px">
  <div style="font-size:12px;font-weight:500;color:var(--state-warning)">警告 · 需注意</div>
  <div class="tok" style="margin-top:4px">--state-warning</div>
 </div>
</div>
<div style="flex:1;border-radius:var(--radius-lg);overflow:hidden">
 <div style="height:38px;background:var(--state-error)"></div>
 <div style="background:var(--state-error-surface);padding:11px">
  <div style="font-size:12px;font-weight:500;color:var(--state-error)">错误 · 危险操作</div>
  <div class="tok" style="margin-top:4px">--state-error</div>
 </div>
</div>
<div style="flex:1;border-radius:var(--radius-lg);overflow:hidden">
 <div style="height:38px;background:var(--state-info)"></div>
 <div style="background:var(--state-info-surface);padding:11px">
  <div style="font-size:12px;font-weight:500;color:var(--state-info)">信息提示</div>
  <div class="tok" style="margin-top:4px">--state-info</div>
 </div>
</div>
</div></div></body></html>
