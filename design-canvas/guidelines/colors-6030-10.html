<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}

.sw .n{font-size:10px;line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;opacity:.72}

 <div style="flex:15;background:var(--brand-600);display:flex;align-items:flex-end;padding:11px"><span style="font-size:12px;color:#FBF9F5">15% · 实体色</span></div>
 <div style="flex:5;background:var(--zhu-600);display:flex;align-items:flex-end;padding:11px"><span style="font-size:11px;color:#FBF9F5">5%</span></div>
</div>
