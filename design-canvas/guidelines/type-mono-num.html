<!-- @dsCard group="Type" viewport="700x150" name="数字与等宽" subtitle="所有数值走西文字族 + tabular-nums；代码与 Token 走 JetBrains Mono" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.wrap{padding:18px 20px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;gap:1px}
.sw .n{font-size:10px;font-family:var(--font-sans);line-height:1.3}
.sw .h{font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;opacity:.75}
.lbl{font-family:var(--font-western);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
</style></head><body><div class="wrap"><div class="row" style="gap:28px">
 <div><div class="lbl">KPI 数值</div><div style="font-family:var(--font-western);font-size:34px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text-heading)">128,400.62</div></div>
 <div><div class="lbl">表格数值</div><div style="font-family:var(--font-western);font-size:14px;font-variant-numeric:tabular-nums;color:var(--text-body)">¥1,284,500.00<br>15.7% · 2026-07-20 · 14:30</div></div>
 <div><div class="lbl">Token / Code</div><div style="font-family:var(--font-mono);font-size:13px;color:var(--text-body)">--brand-600<br>var(--space-5)</div></div>
</div></div></body></html>
